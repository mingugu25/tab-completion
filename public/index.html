<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Completion MVP</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
        color: #1f2328;
      }
      h1 {
        margin: 0 0 12px;
      }
      .desc {
        margin-bottom: 12px;
        color: #57606a;
      }
      textarea {
        width: 100%;
        height: 320px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.5;
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 12px;
        box-sizing: border-box;
      }
      .status {
        margin-top: 10px;
        color: #57606a;
        font-size: 13px;
      }
      code {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Tab 补全最小 Demo</h1>
    <div class="desc">
      按 <code>Tab</code> 触发补全：会读取光标前最近 100 字符，调用后端接口并插入返回内容。
    </div>

    <textarea id="editor" spellcheck="false">function demo() {
  const user = "panpan"
  user.
}</textarea>
    <div class="status" id="status">状态：就绪</div>

    <script src="/main.js"></script>
  </body>
</html>
